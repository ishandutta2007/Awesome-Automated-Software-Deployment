<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>
    
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
      .pill-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
      .code-text { font-family: monospace; font-size: 13px; fill: #38bdf8; }
      
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
        100% { transform: translateY(0px); }
      }
      
      @keyframes pulseLine {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }

      .animated-float { animation: float 6s ease-in-out infinite; }
      .animated-float-delayed { animation: float 7s ease-in-out 2s infinite; }
      .pulse-line { stroke-dasharray: 20, 10; animation: pulseLine 12s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />
  
  <!-- Subtle Grid Lines -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M 0,100 L 1200,100 M 0,200 L 1200,200 M 0,300 L 1200,300" />
    <path d="M 200,0 L 200,400 M 400,0 L 400,400 M 600,0 L 600,400 M 800,0 L 800,400 M 1000,0 L 1000,400" />
  </g>

  <!-- Dynamic Glowing Pipeline Lines in Background (Behind Text) -->
  <g stroke="url(#accentGrad)" stroke-width="3" fill="none" opacity="0.4" class="pulse-line">
    <path d="M 100,340 C 300,340 350,320 500,320 C 650,320 700,350 950,350 L 1100,350" />
    <path d="M 50,50 C 250,50 350,80 600,80 C 850,80 950,50 1150,50" />
  </g>

  <!-- Floating Pipeline Node Pills (Positioned around borders to avoid center text) -->
  <!-- Left Pill -->
  <g class="animated-float" transform="translate(70, 70)">
    <rect width="180" height="44" rx="22" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1.5" />
    <circle cx="26" cy="22" r="8" fill="#10b981" />
    <text x="44" y="27" class="pill-text">GitOps Sync: Active</text>
  </g>

  <!-- Right Top Pill -->
  <g class="animated-float-delayed" transform="translate(930, 65)">
    <rect width="200" height="44" rx="22" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="26" cy="22" r="8" fill="#3b82f6" />
    <text x="44" y="27" class="pill-text">Canary: 100% Success</text>
  </g>

  <!-- Right Bottom Pill -->
  <g class="animated-float" transform="translate(910, 280)">
    <rect width="220" height="44" rx="22" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.5" />
    <text x="24" y="27" class="code-text">helm upgrade --install</text>
  </g>

  <!-- Bottom Left Badge -->
  <g class="animated-float-delayed" transform="translate(80, 285)">
    <rect width="190" height="40" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" />
    <text x="20" y="25" class="pill-text">⚡ Auto-Rollback Ready</text>
  </g>

  <!-- Main Content Foreground (Clear, Unobstructed Center & Header) -->
  <g transform="translate(600, 185)" text-anchor="middle">
    <!-- Main Title Glow -->
    <text x="0" y="0" class="title" filter="url(#glow)" opacity="0.3">Awesome Automated Software Deployment</text>
    <!-- Main Title -->
    <text x="0" y="0" class="title">Awesome Automated Software Deployment 🚀</text>
    
    <!-- Subtitle -->
    <text x="0" y="42" class="subtitle">Curated Commercial CD Platforms &amp; Open-Source GitOps Tools</text>
    
    <!-- Decorative Gradient Divider Bar -->
    <rect x="-180" y="68" width="360" height="4" rx="2" fill="url(#accentGrad)" />
  </g>
</svg>
